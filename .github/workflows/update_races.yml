name: Auto Update JRA Races

on:
  schedule:
    # 水曜19時、木曜13時、木曜19時（枠順確定前の事前予想用）
    - cron: '0 10 * * 3'
    - cron: '0 4 * * 4'
    - cron: '0 10 * * 4'
    # 金曜11時、金曜18時（全レース枠順確定用）
    - cron: '0 2 * * 5'
    - cron: '0 9 * * 5'
    # 土曜・日曜 9:00〜16:00 毎時0分（リアルタイムオッズ・馬体重用）
    - cron: '0 0,1,2,3,4,5,6,7 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn joblib pdfplumber beautifulsoup4 requests

      - name: Run data fetch and AI scoring
        run: python fetch_and_predict.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto update race predictions"
          git push

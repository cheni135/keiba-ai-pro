name: Auto Update JRA Races
on:
  push:
    paths:
      - 'sp_raw.txt'
  schedule:
    - cron: '0 3 * * 5,6,0'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pandas numpy lxml html5lib
      - run: python fetch_and_predict.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest_races.csv
          git commit -m "Auto update JRA races" || exit 0
          git push

name: Auto Update JRA Races

on:
  push:
    branches:
      - main
    paths:
      - 'sp_raw.txt'
      - 'odds_raw.txt'
      - 'result_raw.txt'
      - 'target_kaisai.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy beautifulsoup4 requests lxml

      - name: Fetch and predict races
        run: |
          python fetch_and_predict.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latest_races.csv history_races.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update JRA race data" && git push)
